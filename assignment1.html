<!DOCTYPE html>
<html lang
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0
        <title>My Web Page</title>
        <link rel="icon" type="image/x-icon" href="https://img.magnific.com/free-vector/letter-s-icon-logo-design-vector_474888-4277.jpg?semt=ais_hybrid&w=740&q=80">
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                margin: 20px;
            }
            h1 {
                color: #6431ca;
            }
            p {
                font-size: 18px;
            }
            img {
                display: block;
                margin: 20px 0;
            }
            a {
                color: #be1b2b;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th, td {
                padding: 10px;
                text-align: left;
            }
            th {
                background-color: #4eccd7;
                color: rgb(22, 2, 2);
            }
            .status-approved {
                background-color: #d4edda;
                color: #155724;
            }
            .status-rejected {
                background-color: #f8d7da;
                color: #721c24;
            }
            .status-pending {
                background-color: #fff3cd;
                color: #856404;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to My Web Page</h1>
        <p>Hello World</p>
        <img src="https://picjumbo.com/wp-content/uploads/beautiful-nature-wallpaper-spring-flowers-mountain-sunset-free-image.jpg" alt="Description of image" width="500" height="300">
        <br>
        <a href="https://www.google.com" target="_blank">Visit Google</a>
        <br>
        <marquee>This is sample marquee</marquee>
        <button onclick="alert('Button clicked!')">Click Me</button>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
                <th>Gender</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>Sharvani</td>
                <td>21</td>
                <td>Bangalore</td>
                <td>Female</td>
                <td>Approved</td>
            </tr>
            </tr>
            <tr>
                <td>Kijole</td>
                <td>25</td>
                <td>Chennai</td>
                <td>Female</td>
                <td>Rejected</td>
            </tr>
            <tr>
                <td>Ari</td>
                <td>22</td>
                <td>Mumbai</td>
                <td>Male</td>
                <td>Pending</td>
            </tr>
            </tr>
        </table>
    </body>
</html>
